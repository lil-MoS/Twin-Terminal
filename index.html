<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Twin Terminal</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css"
>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #08080d;
    color: #ffffff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    display: flex;
}

/* LOGIN */

.login {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(124,58,237,.18),
            transparent 40%
        ),
        #08080d;

    z-index: 100;
}

.login-box {
    width: min(420px, calc(100% - 32px));

    padding: 34px;

    background:
        rgba(18,18,28,.88);

    border: 1px solid rgba(168,85,247,.25);

    border-radius: 20px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        0 0 60px rgba(124,58,237,.08);

    backdrop-filter: blur(20px);
}

.logo {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    font-size: 27px;

    box-shadow:
        0 10px 35px rgba(124,58,237,.35);
}

.login h1 {
    margin: 20px 0 7px;

    font-size: 26px;
}

.login p {
    margin: 0 0 25px;

    color: #858597;

    font-size: 14px;
}

.password {
    width: 100%;

    padding: 14px 16px;

    border: 1px solid #2a2a3a;

    border-radius: 12px;

    background: #0d0d15;

    color: white;

    outline: none;

    font-size: 15px;
}

.password:focus {
    border-color: #8b5cf6;

    box-shadow:
        0 0 0 3px rgba(139,92,246,.12);
}

.connect {
    width: 100%;

    margin-top: 13px;

    padding: 14px;

    border: 0;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #9333ea
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.connect:hover {
    transform: translateY(-1px);

    box-shadow:
        0 10px 30px rgba(124,58,237,.3);
}

.error {
    color: #fb7185;

    margin-top: 12px;

    font-size: 13px;

    display: none;
}

/* APP */

.app {
    width: 100%;
    height: 100%;

    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 235px;

    flex-shrink: 0;

    background:
        linear-gradient(
            180deg,
            #0c0c13,
            #09090e
        );

    border-right: 1px solid #1b1b27;

    display: flex;
    flex-direction: column;

    padding: 20px 14px;
}

.brand {
    display: flex;

    align-items: center;

    gap: 12px;

    padding: 7px 10px 24px;
}

.brand-icon {
    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    font-size: 19px;
}

.brand-title {
    font-weight: 800;
}

.brand-sub {
    font-size: 11px;

    color: #666679;

    margin-top: 2px;
}

.nav-title {
    padding: 15px 11px 8px;

    font-size: 10px;

    color: #555566;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

.nav-item {
    display: flex;

    align-items: center;

    gap: 11px;

    padding: 11px;

    margin-bottom: 4px;

    color: #878797;

    border-radius: 9px;

    font-size: 13px;

    cursor: pointer;
}

.nav-item.active {
    color: white;

    background:
        rgba(124,58,237,.13);

    border:
        1px solid rgba(124,58,237,.18);
}

.nav-item:hover {
    background: rgba(255,255,255,.04);

    color: white;
}

.sidebar-bottom {
    margin-top: auto;
}

.server-status {
    padding: 13px;

    border-radius: 12px;

    background: #101019;

    border: 1px solid #1c1c29;
}

.status-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 11px;

    color: #777789;
}

.online {
    color: #4ade80;
}

.dot {
    width: 7px;
    height: 7px;

    display: inline-block;

    border-radius: 50%;

    background: #4ade80;

    box-shadow:
        0 0 10px #4ade80;
}

/* MAIN */

.main {
    min-width: 0;

    flex: 1;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at 70% 0%,
            rgba(124,58,237,.07),
            transparent 30%
        ),
        #09090f;
}

/* HEADER */

.header {
    height: 65px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    border-bottom: 1px solid #1b1b27;

    background:
        rgba(10,10,16,.8);

    backdrop-filter: blur(15px);
}

.header-left {
    display: flex;

    align-items: center;

    gap: 12px;
}

.menu {
    display: none;

    border: 0;

    background: transparent;

    color: white;

    font-size: 21px;
}

.server-name {
    font-size: 14px;

    font-weight: 700;
}

.server-path {
    color: #666678;

    font-size: 11px;

    margin-top: 3px;
}

.header-right {
    display: flex;

    align-items: center;

    gap: 15px;
}

.connection {
    display: flex;

    align-items: center;

    gap: 7px;

    padding: 7px 10px;

    border-radius: 8px;

    background: rgba(74,222,128,.06);

    color: #4ade80;

    font-size: 11px;
}

.icon-button {
    width: 34px;
    height: 34px;

    border: 1px solid #252532;

    background: #11111a;

    border-radius: 8px;

    color: #8b8b9d;

    cursor: pointer;
}

/* TERMINAL */

.terminal-area {
    flex: 1;

    min-height: 0;

    padding: 15px;
}

.terminal-card {
    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 13px;

    border: 1px solid #222230;

    background: #08080d;

    box-shadow:
        0 20px 70px rgba(0,0,0,.3);
}

.terminal-top {
    height: 38px;

    display: flex;

    align-items: center;

    padding: 0 13px;

    gap: 7px;

    background: #101019;

    border-bottom: 1px solid #1d1d29;
}

.window-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;
}

.red {
    background: #fb7185;
}

.yellow {
    background: #fbbf24;
}

.green {
    background: #4ade80;
}

.terminal-title {
    margin-left: 7px;

    color: #68687b;

    font-size: 11px;
}

#terminal {
    width: 100%;
    height: calc(100% - 38px);

    padding: 10px;
}

/* MOBILE */

@media(max-width: 700px) {

    .sidebar {
        position: fixed;

        left: -250px;

        top: 0;
        bottom: 0;

        z-index: 50;

        transition: .25s;
    }

    .sidebar.open {
        left: 0;
    }

    .menu {
        display: block;
    }

    .header {
        padding: 0 12px;
    }

    .connection {
        padding: 6px 8px;
    }

    .connection span {
        display: none;
    }

    .terminal-area {
        padding: 8px;
    }

    .terminal-card {
        border-radius: 9px;
    }

}

</style>

</head>

<body>

<!-- LOGIN -->

<div class="login" id="login">

    <div class="login-box">

        <div class="logo">
            ⚡
        </div>

        <h1>Twin Terminal</h1>

        <p>
            Secure web terminal for your Linux container.
        </p>

        <input
            id="password"
            class="password"
            type="password"
            placeholder="Enter terminal password"
            autocomplete="current-password"
        >

        <button
            class="connect"
            onclick="connect()"
        >
            Connect to Terminal
        </button>

        <div
            class="error"
            id="error"
        >
            Invalid password
        </div>

    </div>

</div>


<!-- APPLICATION -->

<div class="app">

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="brand">

            <div class="brand-icon">
                ⚡
            </div>

            <div>

                <div class="brand-title">
                    Twin Terminal
                </div>

                <div class="brand-sub">
                    Web Linux Environment
                </div>

            </div>

        </div>


        <div class="nav-title">
            Workspace
        </div>

        <div class="nav-item active">
            <span>⌘</span>
            Terminal
        </div>

        <div class="nav-item">
            <span>◈</span>
            Files
        </div>

        <div class="nav-item">
            <span>⚙</span>
            Settings
        </div>


        <div class="sidebar-bottom">

            <div class="server-status">

                <div class="status-row">

                    <span>Status</span>

                    <span class="online">
                        <span class="dot"></span>
                        Online
                    </span>

                </div>

                <br>

                <div class="status-row">

                    <span>Memory</span>

                    <span id="memory">
                        --
                    </span>

                </div>

                <br>

                <div class="status-row">

                    <span>Load</span>

                    <span id="cpu">
                        --
                    </span>

                </div>

            </div>

        </div>

    </aside>


    <main class="main">

        <header class="header">

            <div class="header-left">

                <button
                    class="menu"
                    onclick="toggleSidebar()"
                >
                    ☰
                </button>

                <div>

                    <div class="server-name">
                        Twin Linux
                    </div>

                    <div class="server-path">
                        /data
                    </div>

                </div>

            </div>


            <div class="header-right">

                <div class="connection">

                    <span class="dot"></span>

                    <span>
                        Connected
                    </span>

                </div>

                <button
                    class="icon-button"
                    onclick="clearTerminal()"
                >
                    ⌫
                </button>

            </div>

        </header>


        <section class="terminal-area">

            <div class="terminal-card">

                <div class="terminal-top">

                    <div class="window-dot red"></div>
                    <div class="window-dot yellow"></div>
                    <div class="window-dot green"></div>

                    <div class="terminal-title">
                        root@twin: /data
                    </div>

                </div>

                <div id="terminal"></div>

            </div>

        </section>

    </main>

</div>


<script>

let term;
let socket;
let fitAddon;

function connect() {

    const password =
        document.getElementById("password").value;

    if (!password) {
        return;
    }

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket = new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
    );

    socket.onopen = () => {

        socket.send(
            JSON.stringify({
                type: "auth",
                password: password
            })
        );

    };

    socket.onmessage = (event) => {

        if (typeof event.data === "string") {

            try {

                const message =
                    JSON.parse(event.data);

                if (
                    message.type === "auth"
                ) {

                    if (
                        message.success
                    ) {

                        document
                            .getElementById("login")
                            .style.display = "none";

                        startTerminal(password);

                    } else {

                        showError();

                    }

                }

            } catch {

                term?.write(event.data);

            }

        } else {

            const reader =
                new FileReader();

            reader.onload = () => {

                term.write(
                    new Uint8Array(
                        reader.result
                    )
                );

            };

            reader.readAsArrayBuffer(
                event.data
            );

        }

    };

    socket.onclose = () => {

        if (term) {

            term.write(
                "\r\n\x1b[31mConnection closed.\x1b[0m\r\n"
            );

        }

    };

}


function startTerminal(password) {

    term = new Terminal({

        cursorBlink: true,

        cursorStyle: "block",

        fontFamily:
            "'JetBrains Mono', 'Fira Code', monospace",

        fontSize: 14,

        lineHeight: 1.2,

        theme: {

            background: "#08080d",

            foreground: "#e6e6f0",

            cursor: "#a855f7",

            cursorAccent: "#08080d",

            selectionBackground:
                "rgba(168,85,247,.28)",

            black: "#101018",

            red: "#fb7185",

            green: "#4ade80",

            yellow: "#facc15",

            blue: "#60a5fa",

            magenta: "#c084fc",

            cyan: "#22d3ee",

            white: "#f4f4f5",

            brightBlack: "#52525b",

            brightRed: "#fb7185",

            brightGreen: "#86efac",

            brightYellow: "#fde68a",

            brightBlue: "#93c5fd",

            brightMagenta: "#d8b4fe",

            brightCyan: "#67e8f9",

            brightWhite: "#ffffff"

        }

    });

    fitAddon =
        new FitAddon.FitAddon();

    term.loadAddon(fitAddon);

    term.open(
        document.getElementById("terminal")
    );

    fitAddon.fit();

    term.write(
        "\x1b[1;35m"
        + "\r\n"
        + "  ⚡ Twin Terminal"
        + "\r\n"
        + "\x1b[0m"
        + "\x1b[90m"
        + "  Secure Linux Web Terminal"
        + "\r\n"
        + "  Connected successfully."
        + "\r\n\r\n"
        + "\x1b[0m"
    );

    term.onData((data) => {

        socket.send(
            JSON.stringify({
                type: "input",
                data: data
            })
        );

    });

    resizeTerminal();

    term.focus();

}


function resizeTerminal() {

    if (!fitAddon || !term) {
        return;
    }

    fitAddon.fit();

    if (socket?.readyState === WebSocket.OPEN) {

        socket.send(
            JSON.stringify({
                type: "resize",

                rows: term.rows,

                cols: term.cols
            })
        );

    }

}


function clearTerminal() {

    if (term) {
        term.clear();
        term.focus();
    }

}


function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


function showError() {

    document
        .getElementById("error")
        .style.display = "block";

}


window.addEventListener(
    "resize",
    resizeTerminal
);


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {
                connect();
            }

        }
    );


async function updateStats() {

    try {

        const response =
            await fetch("/api/stats");

        const data =
            await response.json();

        document
            .getElementById("memory")
            .textContent = data.memory;

        document
            .getElementById("cpu")
            .textContent = data.cpu;

    } catch {}

}


setInterval(
    updateStats,
    5000
);

updateStats();

</script>

</body>
</html>
